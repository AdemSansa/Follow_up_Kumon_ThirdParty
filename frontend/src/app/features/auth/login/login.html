<div class="login">
  <mat-card class="login__card">
    <mat-card-header>
      <mat-card-title>Student Follow-Up</mat-card-title>
      <mat-card-subtitle>Sign in to continue</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <mat-error>A valid email is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p class="login__error">{{ message }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="loading()" class="login__submit">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
