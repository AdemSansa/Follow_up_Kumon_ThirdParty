<h1>Reschedule follow-up</h1>
@if (studentName()) {
  <p class="reschedule__student">For <strong>{{ studentName() }}</strong></p>
}

@if (loading()) {
  <mat-spinner diameter="32"></mat-spinner>
} @else {
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="reschedule__form">
        <mat-form-field appearance="outline">
          <mat-label>New start time</mat-label>
          <input matInput type="datetime-local" formControlName="scheduledStart" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>New end time</mat-label>
          <input matInput type="datetime-local" formControlName="scheduledEnd" />
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p class="reschedule__error">{{ message }}</p>
        }

        <div class="reschedule__actions">
          <a mat-button [routerLink]="cancelLink">Cancel</a>
          <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
            {{ saving() ? 'Saving…' : 'Save' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
}
