services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-followup}
      POSTGRES_USER: ${POSTGRES_USER:-followup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${DB_HOST_PORT:-5544}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-followup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher: the backend sends parent emails here in dev
  # (SMTP localhost:1025). Read them at http://localhost:8025 — nothing
  # leaves your machine.
  mail:
    image: axllent/mailpit:v1.20.0
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:

# backend and frontend services are added once each is scaffolded
# (Sprint 1 and beyond) so `docker compose up -d` stays usable for local dev
# in the meantime.
