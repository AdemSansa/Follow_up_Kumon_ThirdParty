services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-followup}
      POSTGRES_USER: ${POSTGRES_USER:-followup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-followup}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:

# backend and frontend services are added once each is scaffolded
# (Sprint 1 and beyond) so `docker compose up -d` stays usable for local dev
# in the meantime.
