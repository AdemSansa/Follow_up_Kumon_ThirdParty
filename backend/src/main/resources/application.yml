spring:
  application:
    name: followup
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/followup}
    username: ${DATABASE_USERNAME:followup}
    password: ${DATABASE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Student photos are capped at 2 MB in StudentPhotoController; allow a little multipart overhead.
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  # Outgoing email to parents (Meet invites). Dev default = the Mailpit
  # container from docker-compose (web inbox at http://localhost:8025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Email is optional (only Meet invites use it): an unreachable mail
    # server must not mark the whole backend DOWN.
    mail:
      enabled: false

app:
  # Online check-ins: Google Meet links + day-before parent emails.
  # Setup guide: docs/features/google-meet.md
  meetings:
    automation-enabled: ${MEETINGS_AUTOMATION_ENABLED:false}
    poll-interval: ${MEETINGS_POLL_INTERVAL:PT5M}
    create-lead: ${MEETINGS_CREATE_LEAD:PT48H}
    invite-lead: ${MEETINGS_INVITE_LEAD:PT24H}
    max-attempts: 5
    timezone: ${APP_TIMEZONE:}
    center-name: ${CENTER_NAME:Kumon Center}
    mail-from: ${MAIL_FROM:no-reply@example.com}
    # Where the browser goes back to after "Connect Google".
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    # Google OAuth client ("Web application") — free; works with plain Gmail.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google/oauth/callback}
  # Encrypts stored Google refresh tokens. Long random value outside local dev.
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  seed:
    # Local dev only: fill an EMPTY database with sample students, parents,
    # teachers and follow-up history (see com.school.dev.DevDataSeeder).
    enabled: ${SEED_DEV_DATA:false}
  cors:
    # Comma-separated list of frontend origins allowed to call /api/**.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:changeme}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:changeme}
  bootstrap-staff:
    email: ${STAFF_EMAIL:staff@example.com}
    password: ${STAFF_PASSWORD:changeme}

logging:
  level:
    root: INFO
    com.school: DEBUG
    org.springframework.security: INFO
